<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Manifest Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; background: #0969da; color: white; border: none; border-radius: 6px; }
    button:hover { background: #0550ae; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; max-height: 350px; border: 1px solid #d0d7de; }
    .status { margin: 1rem 0; font-weight: 600; }
  </style>
</head>
<body>
  <h2>Generate <code>manifest.json</code></h2>
  <p>Select your <strong>project root folder</strong> (the folder containing <code>assets/</code>). It will scan <code>assets</code> and save <code>manifest.json</code> directly alongside it.</p>
  
  <button id="scanBtn">Select Project Folder &amp; Generate</button>
  <div id="status" class="status"></div>
  <pre id="output" hidden></pre>

  <script>
    async function buildTree(dirHandle, currentPath) {
      const entries = [];
      for await (const entry of dirHandle.values()) {
        if (!entry.name.startsWith('.')) {
          entries.push(entry);
        }
      }

      // Sort folders first, then alphabetically
      entries.sort((a, b) => {
        if (a.kind !== b.kind) {
          return a.kind === 'directory' ? -1 : 1;
        }
        return a.name.localeCompare(b.name);
      });

      const children = [];
	  const list = {};
	  
      for (const entry of entries) {
        const entryPath = `${currentPath}/${entry.name}`;
		let item = null;
		
        if (entry.kind === 'directory') {
		  item = await buildTree(entry, entryPath);
        } else {
		  item = {name: entry.name,  path: entryPath,  type: 'file'};	  
        }
		
		if (item) {
          children.push(item);
		  list[entry.name] = item;			
		}
      }

      return {
        name: dirHandle.name,
        path: currentPath,
        type: 'directory',
        children,
		list
      };
    }

    document.getElementById('scanBtn').addEventListener('click', async () => {
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('output');

      try {
        // Request readwrite permission on the project root so it can write manifest.json directly
        const rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        
        let assetsHandle;
        try {
          assetsHandle = await rootHandle.getDirectoryHandle('assets');
        } catch {
          statusEl.textContent = '❌ Could not find an "assets" folder inside the selected directory.';
          return;
        }

        statusEl.textContent = 'Scanning...';
        const tree = await buildTree(assetsHandle, 'assets');
        const jsonString = JSON.stringify(tree, null, 2);

        // Write manifest.json directly into the project root
        const fileHandle = await rootHandle.getFileHandle('manifest.json', { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(jsonString);
        await writable.close();

        statusEl.textContent = '✅ Saved manifest.json directly to your project folder!';
        outputEl.textContent = jsonString;
        outputEl.hidden = false;
      } catch (err) {
        if (err.name !== 'AbortError') {
          statusEl.textContent = `❌ Error: ${err.message}`;
        }
      }
    });
  </script>
</body>
</html>
